<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Filmovi</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f2f2f2; }
        nav a { margin-right: 12px; }
    </style>
</head>
<body>

<nav>
    <a href="/a">Filmovi</a>
    <a href="/b">Karte</a>
</nav>

<h2>Lista filmova</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Naziv</th>
        <th>Žanr</th>
        <th>Trajanje (min)</th>
        <th>Godina</th>
        <th>Detalji</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="film : ${filmovi}">
        <td th:text="${film.id}"></td>
        <td th:text="${film.naziv}"></td>
        <td th:text="${film.zanr}"></td>
        <td th:text="${film.trajanje}"></td>
        <td th:text="${film.godina}"></td>
        <td>
            <a th:href="@{/a/action/{id}(id=${film.id})}">
                Pogledaj detalje
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
