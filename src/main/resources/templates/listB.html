<!DOCTYPE html>
<html lang="bs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lista karata</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 24px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }

        nav a {
            margin-right: 12px;
        }
    </style>
</head>
<body>

<nav>
    <a href="/a">Filmovi</a>
    <a href="/b">Karte</a>
</nav>

<h2>Lista karata</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Cijena (KM)</th>
        <th>Red</th>
        <th>Sjedište</th>
        <th>Film</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="karta : ${karte}">
        <td th:text="${karta.id}"></td>
        <td th:text="${karta.cijena}"></td>
        <td th:text="${karta.red}"></td>
        <td th:text="${karta.sjediste}"></td>
        <td>
            <span th:if="${karta.film != null}"
                  th:text="${karta.film.naziv}"></span>
            <span th:if="${karta.film == null}">
                Nije dodijeljen film
            </span>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(karte)}">
        <td colspan="5">Trenutno nema karata.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
