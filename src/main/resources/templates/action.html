<!DOCTYPE html>
<html lang="bs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Detalji filma</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 24px;
        }

        nav a {
            margin-right: 12px;
        }

        .detalji {
            background: #f7f7f7;
            padding: 16px;
            margin: 20px 0;
            border-radius: 6px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }
    </style>
</head>
<body>

<nav>
    <a href="/a">Filmovi</a>
    <a href="/b">Karte</a>
</nav>

<h2>Detalji filma</h2>

<div class="detalji">
    <p>
        <strong>ID:</strong>
        <span th:text="${film.id}"></span>
    </p>

    <p>
        <strong>Naziv:</strong>
        <span th:text="${film.naziv}"></span>
    </p>

    <p>
        <strong>Žanr:</strong>
        <span th:text="${film.zanr}"></span>
    </p>

    <p>
        <strong>Trajanje:</strong>
        <span th:text="${film.trajanje} + ' minuta'"></span>
    </p>

    <p>
        <strong>Godina:</strong>
        <span th:text="${film.godina}"></span>
    </p>
</div>

<h3>Karte za ovaj film</h3>

<table>
    <thead>
    <tr>
        <th>ID karte</th>
        <th>Cijena (KM)</th>
        <th>Red</th>
        <th>Sjedište</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="karta : ${karte}">
        <td th:text="${karta.id}"></td>
        <td th:text="${karta.cijena}"></td>
        <td th:text="${karta.red}"></td>
        <td th:text="${karta.sjediste}"></td>
    </tr>

    <tr th:if="${#lists.isEmpty(karte)}">
        <td colspan="4">Nema karata za ovaj film.</td>
    </tr>
    </tbody>
</table>

<p>
    <a href="/a">Nazad na listu filmova</a>
</p>

</body>
</html>
