<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Projekcija</title>
</head>
<body>
<h1> Kino Sistem - Projekcija</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Termin</th>
        <th>Cijena</th>
        <th>Film</th>
        <th>Akcija</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${projekcije}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.termin}">
        </td>
        <td th:text="${p.cijena}"></td>

        <td th:text="${p.film != null ? p.film.naziv : 'Nema filma'}">Film</td>
        <td>

            <form th:action="@{/projekcije/update/{id}(id=${p.id})}" method="post" style="padding: 0; background: none; box-shadow: none; display: flex; gap: 5px;">
                <input type="text" name="termin" th:value="${p.termin}" required style="margin-bottom:0; width: 100px;" />
                <input type="number" step="0.01" name="cijena" th:value="${p.cijena}" required style="margin-bottom:0; width: 80px;" />
                <button type="submit" style="width: auto; padding: 5px 10px; background-color: #007bff;">Ažuriraj</button>
            </form>
            <a th:href="@{/projekcije/delete/{id}(id=${p.id})}" style="color: red; text-decoration: none; font-size: 12px; display: inline-block; margin-top: 5px;">Obriši</a>
        </td>
    </tr>
    </tbody>
</table>


<h2>Dodaj novu projekciju</h2>
<form th:action="@{/projekcije/sacuvaj}" th:object="${projekcija}" method="post">
    <label>Termin:</label>
    <input type="text" th:field="*{termin}" placeholder="npr. 20:00" required />

    <label>Cijena:</label>
    <input type="number" step="0.01" th:field="*{cijena}" placeholder="npr. 8.50" required />

    <label>Izaberi film:</label>
    <select th:field="*{film}" required>
        <option value="">-- Odaberi film --</option>
        <option th:each="f : ${filmovi}" th:value="${f.id}" th:text="${f.naziv}"></option>
    </select>

    <button type="submit">Sačuvaj Projekciju</button>
</form>


</body>
</html>
